[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-knowledge-distiller"
version = "0.1.0"
description = "Open CLAW Knowledge Distiller · 龍蝦知識蒸餾器 — Turn YouTube/Bilibili videos into structured knowledge articles via local Qwen3-ASR + AI summarization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["asr", "transcription", "summarization", "youtube", "bilibili", "mcp", "open-claw", "qwen3-asr", "knowledge-distiller"]
authors = [{ name = "Francis Tam", email = "destinyfrancis@github.com" }]

dependencies = [
    "yt-dlp>=2024.1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "toml>=0.10",
    "keyring>=25.0",
    "aiofiles>=23.0",
    "qwen-asr>=0.0.6",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
kd = "knowledge_distiller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_distiller"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
